<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Uniform Submission</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
</head>
<body>
    <main>
        <h1>Uniform Recycling Submission</h1>
        <form data-user-form action="{{ url_for('submit_uniform') }}" method="post" enctype="multipart/form-data">
            <label for="child_alias">Anonymized child label</label>
            <input id="child_alias" name="child_alias" placeholder="Test Child A" required>

            <label for="uniform_type">Uniform type</label>
            <input id="uniform_type" name="uniform_type" placeholder="Summer T-shirt" required>

            <label for="size">Size</label>
            <input id="size" name="size" placeholder="110" required>

            <label for="image">Uniform image</label>
            <input id="image" name="image" type="file" accept="image/*" required>

            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4"></textarea>

            <button type="submit">Submit</button>
        </form>
        <p><a href="{{ url_for('admin') }}">Admin review</a></p>
    </main>
    <script src="{{ url_for('static', filename='js/user.js') }}"></script>
</body>
</html>
